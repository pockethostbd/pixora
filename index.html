const $=id=>document.getElementById(id),feed=$("feed"),status=$("status"),PAGE=10,FETCH=30;let mode="all",loading=false,ic=null,vc=null,idone=false,vdone=false,ip=[],vp=[],seenI=[],seenV=[],items=[],vi=0,prompt=null;
