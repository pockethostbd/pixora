<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1026"><meta name="description" content="Pixora — explore and download beautiful images.">
<link rel="icon" href="https://pockethostbd.github.io/drive-one/picture/pixora-logo.png">
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css">
<title>Pixora — Explore Images</title>
</head>
<body>
<header class="topbar"><a class="brand" href="./"><img src="https://pockethostbd.github.io/drive-one/picture/pixora-logo.png" alt="Pixora"><span>Pixora</span></a><button id="themeBtn" class="icon-btn" aria-label="Toggle theme">◐</button></header>
<main><section class="hero"><div><p class="eyebrow">VISUAL DISCOVERY</p><h1>Explore something beautiful.</h1><p class="sub">A fast, simple gallery of images. Browse at your own pace.</p></div></section>
<section id="gallery" class="gallery" aria-live="polite"></section>
<div id="sentinel" class="sentinel"><span class="spinner"></span><span id="status">Loading images…</span></div>
</main>
<div id="viewer" class="viewer" hidden><button id="closeViewer" class="viewer-close" aria-label="Close">×</button><button id="prevBtn" class="viewer-nav prev" aria-label="Previous">‹</button><img id="viewerImg" alt=""><a id="viewerDownload" class="viewer-download" download>Download</a><button id="nextBtn" class="viewer-nav next" aria-label="Next">›</button></div>
<script type="module" src="app.js"></script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script>
</body></html>
