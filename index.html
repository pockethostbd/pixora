<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1026"><link rel="icon" href="https://pockethostbd.github.io/drive-one/picture/pixora-logo.png"><link rel="stylesheet" href="admin.css"><title>Pixora Admin</title></head><body><main class="wrap"><header><div class="brand"><img src="https://pockethostbd.github.io/drive-one/picture/pixora-logo.png"><div><b>Pixora</b><small>Offline Admin</small></div></div><span id="net" class="pill">Checking…</span></header><section id="loginBox" class="panel"><h1>Admin access</h1><p>Sign in with the Firebase Authentication account created for your Pixora admin.</p><input id="email" type="email" placeholder="Admin email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="login">Sign in</button><p id="loginMsg" class="msg"></p></section><section id="appBox" class="panel" hidden><div class="row"><div><h1>Add image</h1><p>Only image URLs are stored in Firestore.</p></div><button id="logout" class="ghost">Sign out</button></div><form id="form"><input id="url" type="url" required placeholder="https://example.com/image.jpg"><button>Add image</button></form><div id="queue" class="queue"></div><div class="stats"><span id="count">0 images</span><span id="sync">Ready</span></div><div id="list" class="list"></div></section></main><script type="module" src="admin.js"></script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js').catch(()=>{})}</script></body></html>
