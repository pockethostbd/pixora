<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b18" id="themeColor">
<meta name="description" content="Pixora — explore a beautiful, fast and ever-growing stream of images. Discover random pictures and download them instantly.">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" href="https://pixorabd.vercel.app/">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="https://pockethostbd.github.io/drive-one/picture/pixora-logo.png">
<link rel="apple-touch-icon" href="https://pockethostbd.github.io/drive-one/picture/pixora-logo.png">

<meta property="og:type" content="website">
<meta property="og:url" content="https://pixorabd.vercel.app/">
<meta property="og:title" content="Pixora — Explore Something Beautiful">
<meta property="og:description" content="Discover random images in a fast, clean, infinite feed and download them instantly.">
<meta property="og:image" content="https://pockethostbd.github.io/drive-one/picture/pixora-logo.png">
<meta property="og:image:alt" content="Pixora">
<meta property="og:site_name" content="Pixora">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Pixora — Explore Something Beautiful">
<meta name="twitter:description" content="A fast, beautiful and infinite image exploration feed.">
<meta name="twitter:image" content="https://pockethostbd.github.io/drive-one/picture/pixora-logo.png">

<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"WebSite",
  "name":"Pixora",
  "url":"https://pixorabd.vercel.app/",
  "description":"A fast image exploration and download website.",
  "potentialAction":{"@type":"SearchAction","target":"https://pixorabd.vercel.app/?q={search_term_string}","query-input":"required name=search_term_string"}
}
</script>

<title>Pixora — Explore Something Beautiful</title>
<style>
:root{
 --bg:#f4f6fa;--surface:#fff;--surface2:#f8f9fc;--text:#111827;--muted:#667085;
 --line:#e6e8ee;--brand:#2563eb;--brand2:#7c3aed;--shadow:0 8px 28px rgba(15,23,42,.07);
}
[data-theme="dark"]{
 --bg:#070a12;--surface:#0e1420;--surface2:#111827;--text:#f5f7fb;--muted:#98a2b3;
 --line:#20283a;--shadow:0 8px 28px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,a{font:inherit}
button{cursor:pointer}
.header{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px)}
.nav{height:68px;max-width:1200px;margin:auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-size:21px;font-weight:850;letter-spacing:-.7px}
.logo{width:40px;height:40px;border-radius:12px;object-fit:cover}
.nav-actions{display:flex;gap:8px}
.icon{width:42px;height:42px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:13px;display:grid;place-items:center;font-size:19px}
.hero{max-width:1200px;margin:auto;padding:38px 16px 18px}
.hero h1{font-size:clamp(34px,6vw,62px);line-height:1;letter-spacing:-3px;margin:0;max-width:760px}
.gradient{background:linear-gradient(90deg,#2563eb,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:650px;color:var(--muted);font-size:16px;line-height:1.7;margin:16px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:12px;color:var(--muted)}
.feed{width:min(720px,100%);margin:10px auto 0;padding:0 12px 80px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);margin:14px 0;content-visibility:auto;contain-intrinsic-size:500px}
.post-head{display:flex;align-items:center;gap:10px;padding:13px 14px}
.avatar{width:38px;height:38px;border-radius:12px;object-fit:cover}
.post-title{font-weight:800;font-size:14px}.post-meta{font-size:11px;color:var(--muted);margin-top:2px}
.photo-wrap{position:relative;background:var(--surface2);overflow:hidden}
.photo{display:block;width:100%;max-height:820px;object-fit:contain;background:var(--surface2);cursor:zoom-in}
.post-actions{display:flex;align-items:center;justify-content:space-between;padding:11px 12px}
.download{border:0;background:#111827;color:#fff;border-radius:12px;padding:10px 15px;font-weight:800;min-width:110px}
[data-theme="dark"] .download{background:#f8fafc;color:#101828}
.explore{color:var(--muted);font-size:12px}
.skeleton{height:430px;background:linear-gradient(110deg,var(--surface2) 8%,color-mix(in srgb,var(--surface2) 75%,var(--text)) 18%,var(--surface2) 33%);background-size:200% 100%;animation:shine 1.15s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
#sentinel{height:1px}
.status{text-align:center;color:var(--muted);font-size:13px;padding:18px}
.error{margin:20px auto;padding:14px 16px;border-radius:14px;background:#fff1f2;color:#9f1239;border:1px solid #fecdd3;max-width:700px}
.install{position:fixed;z-index:60;left:50%;bottom:16px;transform:translateX(-50%) translateY(130px);width:min(520px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 45px rgba(0,0,0,.2);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;transition:transform .28s ease}
.install.show{transform:translateX(-50%) translateY(0)}
.install img{width:48px;height:48px;border-radius:14px}.install-copy{flex:1}.install-copy b{display:block}.install-copy span{font-size:12px;color:var(--muted);line-height:1.4}
.install button{border:0;border-radius:11px;padding:10px 13px;font-weight:800;background:#111827;color:#fff}.install .dismiss{background:transparent;color:var(--muted);padding:8px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
.viewer.open{display:flex}.viewer img{max-width:96vw;max-height:88vh;object-fit:contain;border-radius:12px}
.close{position:absolute;right:16px;top:16px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.13);color:#fff;font-size:26px}
.viewer-tools{position:absolute;bottom:18px;display:flex;gap:8px}.viewer-tools button{border:0;border-radius:12px;padding:10px 15px;font-weight:800}
@media(max-width:700px){
 .nav{height:62px}.hero{padding:30px 14px 12px}.hero h1{letter-spacing:-2px}.hero p{font-size:14px}
 .feed{padding-left:8px;padding-right:8px}.post{border-radius:16px;margin:10px 0}.photo{max-height:none}.post-head{padding:11px 12px}
}
</style>
</head>
<body>
<header class="header">
 <nav class="nav">
  <a class="brand" href="/" aria-label="Pixora home"><img class="logo" src="https://pockethostbd.github.io/drive-one/picture/pixora-logo.png" alt="Pixora logo"><span>Pixora</span></a>
  <div class="nav-actions">
   <button class="icon" id="themeBtn" aria-label="Toggle dark mode">☾</button>
   <button class="icon" id="installTop" aria-label="Install Pixora" hidden>⌄</button>
  </div>
 </nav>
</header>

<section class="hero">
 <h1>Explore something <span class="gradient">beautiful.</span></h1>
 <p>Infinite image discovery with a clean social-style feed. Scroll, open a picture, and download it in a tap.</p>
 <div class="chips"><span class="chip">∞ Infinite feed</span><span class="chip">Random images</span><span class="chip">Fast loading</span></div>
</section>

<div id="error" class="error" hidden></div>
<main class="feed" id="feed" aria-live="polite"></main>
<div class="status" id="status">Loading your feed…</div>
<div id="sentinel"></div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true">
 <button class="close" id="close" aria-label="Close">×</button>
 <img id="viewerImg" alt="Pixora image">
 <div class="viewer-tools"><button id="prev">Previous</button><button id="next">Next</button><button id="vdownload">Download</button></div>
</div>

<div class="install" id="installCard">
 <img src="https://pockethostbd.github.io/drive-one/picture/pixora-logo.png" alt="">
 <div class="install-copy"><b>Install Pixora</b><span>Get Pixora as an app for a faster, app-like experience.</span></div>
 <button id="installBtn">Install</button><button class="dismiss" id="dismissInstall" aria-label="Dismiss">×</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {getFirestore,collection,query,orderBy,limit,getDocs,startAfter} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCa3miuF5YPQEKbai0Y-IK0IpTXWki7Bjk",
 authDomain:"banglabazarbd.firebaseapp.com",
 projectId:"banglabazarbd",
 storageBucket:"banglabazarbd.firebasestorage.app",
 messagingSenderId:"857609771799",
 appId:"1:857609771799:web:872da567e55515f6c5b552"
};
const db=getFirestore(initializeApp(firebaseConfig));
const feed=document.getElementById("feed"),statusEl=document.getElementById("status"),sentinel=document.getElementById("sentinel");
const errorEl=document.getElementById("error"),PAGE=10,FETCH=30;
let cursor=null,loading=false,done=false,buffer=[],items=[],viewerIndex=0,installPrompt=null;

function validUrl(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:""}catch{return""}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function skeleton(){
 for(let i=0;i<3;i++){const p=document.createElement("article");p.className="post";const s=document.createElement("div");s.className="skeleton";p.appendChild(s);feed.appendChild(p)}
}
function clearSkeleton(){feed.querySelectorAll(".skeleton").forEach(s=>s.closest(".post")?.remove())}

async function fastDownload(url){
 const safe=validUrl(url);if(!safe)return;
 try{
  const r=await fetch(safe,{mode:"cors",cache:"force-cache"});if(!r.ok)throw 0;
  const blob=await r.blob(),a=document.createElement("a"),obj=URL.createObjectURL(blob);
  a.href=obj;a.download="pixora-image";a.style.display="none";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(obj),2000);
 }catch{window.open(safe,"_blank","noopener,noreferrer")}
}
function addPost(url){
 const index=items.length;items.push(url);
 const post=document.createElement("article");post.className="post";
 const head=document.createElement("div");head.className="post-head";
 const av=document.createElement("img");av.className="avatar";av.src="https://pockethostbd.github.io/drive-one/picture/pixora-logo.png";av.alt="Pixora";av.loading="lazy";
 const info=document.createElement("div");info.innerHTML="<div class='post-title'>Pixora</div><div class='post-meta'>Explore · Random image</div>";
 head.append(av,info);
 const wrap=document.createElement("div");wrap.className="photo-wrap";
 const img=document.createElement("img");img.className="photo";img.src=url;img.alt="Beautiful image on Pixora";img.loading=index<2?"eager":"lazy";img.decoding="async";img.fetchPriority=index<2?"high":"auto";img.referrerPolicy="no-referrer";
 img.onerror=()=>{img.style.minHeight="260px";img.style.opacity=".35";img.alt="Image unavailable"};
 img.onclick=()=>openViewer(index);wrap.appendChild(img);
 const actions=document.createElement("div");actions.className="post-actions";
 const exp=document.createElement("span");exp.className="explore";exp.textContent="Pixora feed";
 const dl=document.createElement("button");dl.className="download";dl.textContent="Download";dl.onclick=()=>fastDownload(url);
 actions.append(exp,dl);post.append(head,wrap,actions);feed.appendChild(post);
}
async function fillBuffer(){
 if(done||cursor===false)return;
 let q=query(collection(db,"images"),orderBy("createdAt","desc"),limit(FETCH));
 if(cursor)q=query(collection(db,"images"),orderBy("createdAt","desc"),startAfter(cursor),limit(FETCH));
 const snap=await getDocs(q);
 if(!snap.docs.length){done=true;return}
 cursor=snap.docs[snap.docs.length-1];
 const urls=[];snap.forEach(d=>{const u=validUrl(d.data().imageUrl);if(u)urls.push(u)});
 buffer.push(...shuffle(urls));
 if(snap.docs.length<FETCH)done=true;
}
async function load10(){
 if(loading)return;
 if(buffer.length<PAGE&&!done){await fillBuffer()}
 if(!buffer.length){done=true;statusEl.textContent=items.length?"You've reached the end of Pixora.":"No images have been published yet.";return}
 loading=true;statusEl.textContent="Loading more…";
 const batch=buffer.splice(0,PAGE);batch.forEach(addPost);
 statusEl.textContent=done&&buffer.length===0?"Keep exploring — more may arrive soon.":"Keep scrolling…";
 loading=false;
}
async function start(){
 skeleton();try{await load10();clearSkeleton()}catch(e){clearSkeleton();errorEl.hidden=false;errorEl.textContent="Pixora could not connect to its image feed. Please check the Firebase Firestore connection.";statusEl.textContent="Unable to load feed.";console.error(e)}
}
const observer=new IntersectionObserver(async entries=>{if(entries[0].isIntersecting&&!loading){try{await load10()}catch(e){console.error(e)}}},{rootMargin:"900px 0px"});
observer.observe(sentinel);

const viewer=document.getElementById("viewer"),viewerImg=document.getElementById("viewerImg");
function openViewer(i){viewerIndex=i;viewerImg.src=items[i];viewer.classList.add("open");document.body.style.overflow="hidden"}
function closeViewer(){viewer.classList.remove("open");document.body.style.overflow="";viewerImg.removeAttribute("src")}
function move(d){if(!items.length)return;viewerIndex=(viewerIndex+d+items.length)%items.length;viewerImg.src=items[viewerIndex]}
document.getElementById("close").onclick=closeViewer;
document.getElementById("prev").onclick=()=>move(-1);document.getElementById("next").onclick=()=>move(1);
document.getElementById("vdownload").onclick=()=>fastDownload(items[viewerIndex]);
viewer.onclick=e=>{if(e.target===viewer)closeViewer()};
document.addEventListener("keydown",e=>{if(!viewer.classList.contains("open"))return;if(e.key==="Escape")closeViewer();if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)});

const savedTheme=localStorage.getItem("pixora-theme");
function applyTheme(t){document.documentElement.dataset.theme=t;document.getElementById("themeBtn").textContent=t==="dark"?"☀":"☾";document.getElementById("themeColor").content=t==="dark"?"#070a12":"#f4f6fa"}
applyTheme(savedTheme|| (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
document.getElementById("themeBtn").onclick=()=>{const t=document.documentElement.dataset.theme==="dark"?"light":"dark";localStorage.setItem("pixora-theme",t);applyTheme(t)};

window.addEventListener("beforeinstallprompt",e=>{
 e.preventDefault();installPrompt=e;document.getElementById("installCard").classList.add("show");document.getElementById("installTop").hidden=false;
});
document.getElementById("installBtn").onclick=async()=>{
 if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById("installCard").classList.remove("show")
};
document.getElementById("dismissInstall").onclick=()=>document.getElementById("installCard").classList.remove("show");
window.addEventListener("appinstalled",()=>document.getElementById("installCard").classList.remove("show"));
document.getElementById("installTop").onclick=()=>document.getElementById("installCard").classList.add("show");

start();
</script>
</body>
</html>
