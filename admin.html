<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b18">
<title>Pixora Admin</title>
<style>
:root{--bg:#f5f6fa;--surface:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--brand:#2563eb;--danger:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{width:min(960px,100%);margin:auto;padding:22px 16px 60px}.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:46px;height:46px;border-radius:14px;object-fit:cover}.top h1{margin:0;font-size:22px}.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 35px rgba(16,24,40,.06);margin-bottom:16px}
h2{margin:0 0 16px;font-size:25px}label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;outline:none;background:var(--surface);color:var(--text);font-size:15px;margin-bottom:12px}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#eef2ff;color:#3730a3}.danger{background:#fee2e2;color:#991b1b}.muted{color:var(--muted);font-size:13px;line-height:1.6}.hidden{display:none!important}
.message{padding:12px 14px;border-radius:12px;margin-top:12px;font-size:14px;display:none}.message.show{display:block}.ok{background:#ecfdf3;color:#027a48}.bad{background:#fff1f2;color:#be123c}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.badge{padding:7px 10px;border-radius:999px;background:#eef2f6;color:#475467;font-size:12px;font-weight:800}
.form{display:grid;grid-template-columns:1fr auto;gap:10px}.form input{margin:0}.form .btn{height:46px}
.item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:9px;margin-top:10px}.thumb{width:66px;height:66px;border-radius:10px;object-fit:cover;background:#eef2f6;flex:0 0 auto}.url{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.item .danger{padding:9px 11px;flex:0 0 auto}
.queue{margin-top:14px;padding:12px;border-radius:13px;background:#f8fafc;border:1px dashed var(--line)}
.small{font-size:12px;color:var(--muted)}
@media(max-width:620px){.row{grid-template-columns:1fr}.form{grid-template-columns:1fr}.form .btn{width:100%}.panel{padding:17px;border-radius:18px}}
@media(prefers-color-scheme:dark){:root{--bg:#070a12;--surface:#0f1522;--text:#f5f7fb;--muted:#98a2b3;--line:#242d3e}.primary{background:#f8fafc;color:#101828}.secondary{background:#1d2740;color:#c7d2fe}.queue{background:#0b111d}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img class="logo" src="https://pockethostbd.github.io/drive-one/picture/pixora-logo.png" alt="Pixora">
    <div><h1>Pixora Admin</h1><p>Image URL management</p></div>
  </header>

  <section class="panel" id="loginPanel">
    <h2>Admin access</h2>
    <p class="muted">Sign in with the Firebase Email/Password account you created for Pixora. There is no hard-coded admin password.</p>
    <label>Email</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com">
    <label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your Firebase password">
    <button class="btn primary" id="login">Sign in</button>
    <div class="message bad" id="loginMsg"></div>
  </section>

  <section class="panel hidden" id="adminPanel">
    <div class="status"><div><h2>Manage images</h2><div class="small" id="userLabel"></div></div><span class="badge" id="connection">Checking…</span></div>
    <div class="form">
      <input id="imageUrl" type="url" inputmode="url" placeholder="https://example.com/image.jpg">
      <button class="btn primary" id="add">Add image</button>
    </div>
    <div class="message" id="actionMsg"></div>
    <div class="queue hidden" id="offlineQueue"></div>
    <div id="list"></div>
    <button class="btn secondary" id="logout" style="margin-top:16px">Sign out</button>
  </section>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {getFirestore,collection,addDoc,serverTimestamp,query,orderBy,limit,getDocs,deleteDoc,doc} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCa3miuF5YPQEKbai0Y-IK0IpTXWki7Bjk",
  authDomain:"banglabazarbd.firebaseapp.com",
  projectId:"banglabazarbd",
  storageBucket:"banglabazarbd.firebasestorage.app",
  messagingSenderId:"857609771799",
  appId:"1:857609771799:web:872da567e55515f6c5b552"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id), queueKey="pixora_offline_queue_v2";

function validUrl(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:""}catch{return""}}
function msg(el,text,good=false){el.textContent=text;el.className="message show "+(good?"ok":"bad")}
function setOnline(){ $("connection").textContent=navigator.onLine?"Online":"Offline"; }
function getQueue(){try{return JSON.parse(localStorage.getItem(queueKey)||"[]")}catch{return[]}}
function saveQueue(q){localStorage.setItem(queueKey,JSON.stringify(q))}
function renderQueue(){
  const q=getQueue(),box=$("offlineQueue");
  if(!q.length){box.classList.add("hidden");box.textContent="";return}
  box.classList.remove("hidden");box.innerHTML=`<b>${q.length} queued image${q.length>1?"s":""}</b><div class="small">These URLs are waiting for an internet connection. They will sync when Firebase is reachable.</div>`;
}
async function syncQueue(){
  if(!navigator.onLine||!auth.currentUser)return;
  const q=getQueue();if(!q.length)return;
  const remain=[];
  for(const u of q){try{await addDoc(collection(db,"images"),{imageUrl:u,createdAt:serverTimestamp()})}catch{remain.push(u)}}
  saveQueue(remain);renderQueue();if(!remain.length)loadList();
}
async function loadList(){
  const list=$("list");list.innerHTML='<p class="muted">Loading images…</p>';
  try{
    const snap=await getDocs(query(collection(db,"images"),orderBy("createdAt","desc"),limit(100)));
    list.innerHTML="";
    if(snap.empty){list.innerHTML='<p class="muted">No images yet.</p>';return}
    snap.forEach(d=>{
      const data=d.data(), row=document.createElement("div");row.className="item";
      const img=document.createElement("img");img.className="thumb";img.src=validUrl(data.imageUrl);img.loading="lazy";img.alt="";
      const url=document.createElement("div");url.className="url";url.textContent=data.imageUrl||"";
      const b=document.createElement("button");b.className="btn danger";b.textContent="Delete";
      b.onclick=async()=>{if(!confirm("Delete this image?"))return;try{await deleteDoc(doc(db,"images",d.id));loadList()}catch{msg($("actionMsg"),"Delete failed. Check your Firestore rules.")}};
      row.append(img,url,b);list.appendChild(row);
    });
  }catch(e){list.innerHTML='<p class="muted">Could not load images. Check Firestore rules and your Firebase account.</p>';console.error(e)}
}
async function addImage(){
  const input=$("imageUrl"),url=validUrl(input.value.trim());if(!url){msg($("actionMsg"),"Please enter a valid http/https image URL.");return}
  if(!navigator.onLine){const q=getQueue();if(!q.includes(url))q.push(url);saveQueue(q);input.value="";renderQueue();msg($("actionMsg"),"Saved offline. It will sync when you are online.",true);return}
  try{await addDoc(collection(db,"images"),{imageUrl:url,createdAt:serverTimestamp()});input.value="";msg($("actionMsg"),"Image added successfully.",true);loadList()}catch(e){console.error(e);msg($("actionMsg"),"Could not add image. Make sure this Firebase account is allowed to write to Firestore.")}
}
$("login").onclick=async()=>{
  const email=$("email").value.trim(),password=$("password").value;
  if(!email||!password){msg($("loginMsg"),"Enter your Firebase admin email and password.");return}
  try{await setPersistence(auth,browserLocalPersistence);await signInWithEmailAndPassword(auth,email,password)}
  catch(e){
    const map={ "auth/invalid-credential":"Email or password is incorrect.","auth/user-not-found":"No Firebase user exists with this email.","auth/wrong-password":"Password is incorrect.","auth/invalid-email":"Enter a valid email address.","auth/too-many-requests":"Too many attempts. Try again later."};
    msg($("loginMsg"),map[e.code]||("Login failed: "+e.code));
  }
};
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("login").click()});
$("add").onclick=addImage;$("imageUrl").addEventListener("keydown",e=>{if(e.key==="Enter")addImage()});
$("logout").onclick=()=>signOut(auth);
window.addEventListener("online",()=>{setOnline();syncQueue()});window.addEventListener("offline",setOnline);setOnline();renderQueue();

onAuthStateChanged(auth,user=>{
  if(user){
    $("loginPanel").classList.add("hidden");$("adminPanel").classList.remove("hidden");
    $("userLabel").textContent=user.email||"Signed in";setOnline();renderQueue();loadList();syncQueue();
  }else{$("loginPanel").classList.remove("hidden");$("adminPanel").classList.add("hidden")}
});
</script>
</body>
</html>
