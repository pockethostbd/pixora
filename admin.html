<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b18"><title>Pixora Admin V2</title><style>
:root{--bg:#f5f6fa;--s:#fff;--t:#101828;--m:#667085;--l:#e4e7ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 16px 60px}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.logo{width:46px;height:46px;border-radius:14px}.top h1{margin:0;font-size:22px}.top p{margin:2px 0;color:var(--m);font-size:13px}.panel{background:var(--s);border:1px solid var(--l);border-radius:20px;padding:20px;margin-bottom:15px;box-shadow:0 10px 30px #1018280b}.hidden{display:none}h2{margin:0 0 15px}label{font-size:13px;font-weight:700;display:block;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid var(--l);border-radius:12px;margin-bottom:12px;background:var(--s);color:var(--t);font-size:15px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:#111827;color:#fff}.danger{background:#fee2e2;color:#991b1b}.secondary{background:#eef2ff;color:#3730a3}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{flex:1;border:1px solid var(--l);background:var(--s);color:var(--m);border-radius:12px;padding:11px;font-weight:800}.tab.active{background:#111827;color:#fff}.msg{display:none;padding:11px 13px;border-radius:11px;margin:10px 0;font-size:13px}.msg.show{display:block}.ok{background:#ecfdf3;color:#027a48}.bad{background:#fff1f2;color:#be123c}.item{display:flex;align-items:center;gap:10px;border:1px solid var(--l);padding:8px;border-radius:14px;margin-top:9px}.thumb{width:62px;height:62px;object-fit:cover;border-radius:10px;background:#eee}.url{flex:1;min-width:0;color:var(--m);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.small{color:var(--m);font-size:12px;line-height:1.5}@media(max-width:600px){.panel{padding:16px}}
</style></head><body><div class="wrap"><header class="top"><img class="logo" src="https://pockethostbd.github.io/drive-one/picture/pixora-logo.png" alt="Pixora"><div><h1>Pixora Admin V2</h1><p>Images + Videos · Existing images are preserved</p></div></header><section class="panel" id="login"><h2>Admin access</h2><div class="small">Use your Firebase Email/Password account. There is no fixed password.</div><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="pass" type="password" autocomplete="current-password"><button class="btn primary" id="signin">Sign in</button><div class="msg bad" id="loginMsg"></div></section><section class="panel hidden" id="app"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2>Publish content</h2><div class="small" id="who"></div></div><button class="btn secondary" id="out">Sign out</button></div><div class="tabs"><button class="tab active" data-type="image">Image</button><button class="tab" data-type="video">Video</button></div><label id="label">Image URL</label><input id="value" type="url" placeholder="https://example.com/image.jpg"><button class="btn primary" id="add">Add image</button><div class="msg" id="msg"></div></section><section class="panel hidden" id="listPanel"><h2 id="listTitle">Recent images</h2><div id="list"></div></section></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";import{getFirestore,collection,addDoc,serverTimestamp,query,orderBy,limit,getDocs,deleteDoc,doc}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const c={apiKey:"AIzaSyCa3miuF5YPQEKbai0Y-IK0IpTXWki7Bjk",authDomain:"banglabazarbd.firebaseapp.com",projectId:"banglabazarbd",storageBucket:"banglabazarbd.firebasestorage.app",messagingSenderId:"857609771799",appId:"1:857609771799:web:872da567e55515f6c5b552"},app=initializeApp(c),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let type="image";const valid=v=>{try{let u=new URL(v);return/^https?:$/.test(u.protocol)?u.href:""}catch{return""}};function msg(t,ok=false){$("msg").textContent=t;$("msg").className="msg show "+(ok?"ok":"bad")}
$("signin").onclick=async()=>{try{await setPersistence(auth,browserLocalPersistence);await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value)}catch(e){$("loginMsg").textContent=({"auth/invalid-credential":"Email or password is incorrect.","auth/user-not-found":"No user exists with this email.","auth/wrong-password":"Password is incorrect.","auth/invalid-email":"Enter a valid email."})[e.code]||"Login failed: "+e.code;$("loginMsg").classList.add("show")}};$("pass").onkeydown=e=>{if(e.key==="Enter")$("signin").click()};$("out").onclick=()=>signOut(auth);
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");type=b.dataset.type;$("label").textContent=type==="image"?"Image URL":"YouTube / embed URL";$("value").placeholder=type==="image"?"https://example.com/image.jpg":"https://www.youtube.com/watch?v=...";$("add").textContent=type==="image"?"Add image":"Add video";load()});
$("add").onclick=async()=>{let v=valid($("value").value.trim());if(!v){msg("Enter a valid http/https URL.");return}try{await addDoc(collection(db,type==="image"?"images":"videos"),type==="image"?{imageUrl:v,createdAt:serverTimestamp()}:{videoUrl:v,createdAt:serverTimestamp()});$("value").value="";msg((type==="image"?"Image":"Video")+" added successfully.",true);load()}catch(e){console.error(e);msg("Could not save. Check Firestore rules.")}};
async function load(){if(!auth.currentUser)return;let col=type==="image"?"images":"videos";$("listTitle").textContent=type==="image"?"Recent images":"Recent videos";$("list").innerHTML='<div class="small">Loading…</div>';try{let s=await getDocs(query(collection(db,col),orderBy("createdAt","desc"),limit(100)));$("list").innerHTML="";if(s.empty){$("list").innerHTML='<div class="small">Nothing published yet.</div>';return}s.forEach(d=>{let x=d.data(),v=type==="image"?x.imageUrl:x.videoUrl,row=document.createElement("div");row.className="item";if(type==="image"){let im=document.createElement("img");im.className="thumb";im.src=v;im.loading="lazy";row.append(im)}else{let b=document.createElement("div");b.className="thumb";b.style.display="grid";b.style.placeItems="center";b.textContent="▶";row.append(b)}let u=document.createElement("div");u.className="url";u.textContent=v;let del=document.createElement("button");del.className="btn danger";del.textContent="Delete";del.onclick=async()=>{if(confirm("Delete this content?")){await deleteDoc(doc(db,col,d.id));load()}};row.append(u,del);$("list").append(row)})}catch(e){console.error(e);$("list").innerHTML='<div class="small">Could not load. Check Firestore rules/index.</div>'}}
onAuthStateChanged(auth,u=>{if(u){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("listPanel").classList.remove("hidden");$("who").textContent=u.email||"Signed in";load()}else{$("login").classList.remove("hidden");$("app").classList.add("hidden");$("listPanel").classList.add("hidden")}});
</script></body></html>
